name: Submission checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check saved inputs, models and paper sources
        run: python -m scripts.submission --verify
      - name: Install the recorded numerical environment
        run: python -m pip install -r requirements.txt
      - name: Restore selected caches
        run: python -m scripts.submission --restore-cache
      - name: Recompute results
        run: python -m scripts.run_signal_discovery_guarded --module scripts.submission --stop-file artifacts/submission/STOP --timeout 300 --duty-cycle 0.5 --rss-limit-mib 384 -- --metrics
      - name: Refit the initial window and verify monthly model decisions
        run: python -m scripts.run_signal_discovery_guarded --module scripts.submission --stop-file artifacts/submission/STOP --timeout 600 --duty-cycle 0.5 --rss-limit-mib 384 -- --fit-check
      - name: Run unit tests serially
        run: python -m scripts.run_signal_discovery_guarded --module scripts.submission --stop-file artifacts/submission/STOP --timeout 1800 --duty-cycle 0.5 --rss-limit-mib 384 -- --tests
